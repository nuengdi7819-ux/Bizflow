<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizFlow+ | ระบบบริหารจัดการสินเชื่อและธุรกรรมการเงิน</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Container หลัก -->
    <div class="w-full max-w-xl bg-cardBg border border-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-wide text-white">BizFlow<span class="text-accent">+</span></h1>
            <p class="text-xs text-gray-400">กรอกข้อมูลเบอร์โทรศัพท์เพื่อตรวจสอบสมาชิก และยืนยันตัวตนผ่าน OTP</p>
        </div>

        <!-- Notification Banner -->
        <div class="bg-indigo-950/40 border border-indigo-800/50 rounded-xl p-4 flex items-start space-x-3 text-sm text-indigo-200">
            <span class="text-lg">💡</span>
            <p>ระบบตรวจพบสมาชิกเก่า: ดึงข้อมูลเดิมให้อัตโนมัติและไม่บังคับแนบรูปบัตรประชาชน</p>
        </div>

        <!-- Form Section -->
        <form id="loanForm" onsubmit="handleSubmit(event)" class="space-y-4">
            
            <!-- ชื่อ - นามสกุลจริง -->
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">ชื่อ - นามสกุลจริง *</label>
                <input type="text" id="fullname" value="สมชาย ใจดี" required 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
            </div>

            <!-- เบอร์โทรศัพท์ -->
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">เบอร์โทรศัพท์ (ยืนยันแล้ว)</label>
                <input type="text" id="phone" value="0960719978" readonly 
                    class="w-full bg-gray-900/50 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-gray-400 cursor-not-allowed">
            </div>

            <!-- ลิงก์ Facebook -->
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">ลิงก์ FACEBOOK *</label>
                <input type="url" id="facebook" value="https://facebook.com/somchai.sample" required 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
            </div>

            <!-- Grid 2 คอลัมน์ (จำนวนเงิน & กำหนดจ่าย) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">จำนวนเงินต้นที่ขอกู้ (บาท) *</label>
                    <input type="number" id="amount" value="5000" required 
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">ระบบกำหนดการจ่าย *</label>
                    <select id="paymentCycle" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                        <option value="daily">จ่ายทุกวัน (ทวงทุกวัน)</option>
                        <option value="weekly">จ่ายทุกสัปดาห์</option>
                        <option value="monthly">จ่ายทุกเดือน</option>
                    </select>
                </div>
            </div>

            <!-- แนบไฟล์รูปถ่ายบัตรประชาชน -->
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">แนบไฟล์รูปถ่ายบัตรประชาชน (บังคับเฉพาะลูกค้าใหม่)</label>
                <div class="flex items-center space-x-3 bg-gray-900 border border-gray-700 rounded-xl px-4 py-2">
                    <label class="cursor-pointer bg-accent hover:bg-indigo-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                        เลือกไฟล์
                        <input type="file" id="idCardFile" class="hidden" onchange="updateFileName(this)">
                    </label>
                    <span id="fileNameDisplay" class="text-xs text-gray-400 truncate">Screenshot_2.jpg</span>
                </div>
            </div>

            <!-- ลงลายเซ็นอิเล็กทรอนิกส์ -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-medium text-gray-300">ลงลายเซ็นอิเล็กทรอนิกส์ *</label>
                    <button type="button" onclick="clearSignature()" class="text-xs text-red-400 hover:text-red-300 transition">ล้างลายเซ็น</button>
                </div>
                <div class="relative w-full h-40 bg-gray-900 border border-gray-700 rounded-xl overflow-hidden">
                    <canvas id="signatureCanvas" class="w-full h-full cursor-crosshair touch-none"></canvas>
                </div>
            </div>

            <!-- ปุ่มส่งข้อมูล -->
            <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2 text-sm">
                <span>ส่งคำขอกู้เงินและทำสัญญาออนไลน์</span>
                <span>➔</span>
            </button>

        </form>
    </div>

    <!-- Script สำหรับควบคุม Canvas และ Form -->
    <script>
        // จัดการแสดงชื่อไฟล์ที่อัปโหลด
        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files && input.files[0]) {
                display.textContent = input.files[0].name;
            }
        }

        // --- ระบบ Canvas ลายเซ็นอิเล็กทรอนิกส์ (รองรับ Mouse และ Touch) ---
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.strokeStyle = '#ffffff'; // เส้นสีขาว
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDraw(e) {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            e.preventDefault();
        }

        function drawing(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            e.preventDefault();
        }

        function stopDraw() {
            isDrawing = false;
            ctx.beginPath();
        }

        // Event Listeners สำหรับเมาส์
        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', drawing);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        // Event Listeners สำหรับมือถือ / แท็บเล็ต (Touch)
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', drawing, { passive: false });
        canvas.addEventListener('touchend', stopDraw);

        // ปุ่มล้างลายเซ็น
        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // จัดการเมื่อกดส่งฟอร์ม
        function handleSubmit(e) {
            e.preventDefault();
            alert('ส่งคำขอกู้เงินและบันทึกข้อมูลเรียบร้อยแล้ว!');
        }
    </script>
</body>
</html>
